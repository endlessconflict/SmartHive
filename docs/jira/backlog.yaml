# Single source of truth for the Jira backlog. Edit this file, then run:
#   python docs/jira/build.py
# which regenerates jira-import.csv (Jira CSV importer) and backlog.md (readable view).
# Conventions: docs/jira/README.md

project: {key: SH, name: SmartHive}
repo: https://github.com/endlessconflict/SmartHive/blob/main

people:
  james: James Tack
  ricardo: Ricardo Villarreal
  adrien: Adrien Cubilla
  diego: Diego Alejandro Vasquez
  karen: Karen Jimenez
  maria: Maria de los Angeles Agudelo

# Two-week sprints. Dates after Sprint 3 are a proposal; adjust in Jira and here together.
sprints:
  - {name: SH Sprint 3, start: 2026-09-28, end: 2026-10-11, goal: "Foundations: documented architecture, synthetic data generators and a first trained vision model"}
  - {name: SH Sprint 4, start: 2026-10-12, end: 2026-10-25, goal: "Contracts frozen, Compose stack up, camera chosen, client interview done"}
  - {name: SH Sprint 5, start: 2026-10-26, end: 2026-11-08, goal: "First end-to-end slice: a DHT11 reading and a simulated hive both reach the dashboard"}
  - {name: SH Sprint 6, start: 2026-11-09, end: 2026-11-22, goal: "Vision on the node: detections become events"}
  - {name: SH Sprint 7, start: 2026-11-23, end: 2026-12-06, goal: "Alerts: a hornet in front of the camera becomes an email"}
  - {name: SH Sprint 8, start: 2026-12-07, end: 2026-12-20, goal: "Intelligence: anomaly detection on synthetic telemetry, Varroa index in the UI"}
  - {name: SH Sprint 9, start: 2027-01-04, end: 2027-01-17, goal: "Evaluation report per data tier; optional yield proof of concept"}
  - {name: SH Sprint 10, start: 2027-01-18, end: 2027-01-31, goal: "Field install, soak test, final demo"}

components:
  edge: Software on the Raspberry Pi node
  backend: Ingestor, API, worker, database
  vision: Detector and classifier training, export, benchmarks
  simulation: Synthetic telemetry and image generators
  ml: Time-series models
  frontend: Dashboard
  infra: Docker Compose, broker, certificates, CI
  hardware: Electrical design, sensors, power, enclosure
  docs: Documentation and project management

epics:
  - id: E1
    name: Sensor node & IoT connectivity
    owner: ricardo
    component: edge
    description: "EPIC 1 of the project plan. The Raspberry Pi 3B node measures the hive's internal climate (and later weight), stores readings locally and sends them securely to the server."
    docs: [docs/02-hardware/electrical-design-prototype-1.md, docs/05-backend/03-edge-node-software.md]
  - id: E2
    name: Pest & threat detection
    owner: adrien
    component: vision
    description: "EPIC 2. The entrance camera and a two-stage model on the node detect hornets, small hive beetles and Varroa-carrying bees, and turn them into events and alerts."
    docs: [docs/03-vision/README.md]
  - id: E3
    name: Colony dashboard
    owner: maria
    component: frontend
    description: "EPIC 3. History, latest image, alert log and anomaly warnings for each colony."
    docs: [docs/05-backend/06-api-design.md]
  - id: E4
    name: Honey flow & yield optimization (optional)
    owner: diego
    component: ml
    description: "EPIC 4, optional. 7-day yield estimate as a range, and super/harvest recommendations. Only if Epics 1 to 3 are on track."
    docs: [docs/04-data/03-scenarios-and-events.md]
  - id: E5
    name: Synthetic data platform
    owner: diego
    component: simulation
    description: "New epic created when the client confirmed there is no data. Generators for hive telemetry and entrance images, a real-image check set, dataset governance."
    docs: [docs/04-data/README.md, docs/adr/0002-synthetic-first-training-data.md]
  - id: E6
    name: Backend platform & DevOps
    owner: james
    component: backend
    description: "Enablers for every user-facing story: message contract, Compose stack, database, CI."
    docs: [docs/05-backend/README.md]
  - id: E7
    name: Project foundations
    owner: adrien
    component: docs
    description: "Requirements, architecture, decisions, documentation and the client interview."
    docs: [docs/README.md]

# Story fields: id, epic, summary, story (user story text), type (Story|Task|Spike), priority (Highest|High|Medium|Low),
# points (Fibonacci), sprint, assignee, components, labels, status (To Do|In Progress|Done), ac (acceptance criteria),
# docs, blocked_by, evidence (for Done items), subtasks [{summary, assignee, hours, status}]
stories:
  # ---------------------------------------------------------------- E7 Project foundations
  - id: PM-01
    epic: E7
    type: Task
    summary: Repository structure, contribution rules and documentation set
    story: "As a team, we need one organized repository with the project's documentation in English so that everyone works from the same plan."
    priority: High
    points: 5
    sprint: SH Sprint 3
    assignee: adrien
    components: [docs]
    labels: [documentation]
    status: Done
    ac:
      - "Given the repository, when a new member opens the README, then they find the overview, team, architecture diagram, repo map and roadmap"
      - "Given the team's source documents (plan, design, epics, elicitation, proposal, backlog), when they are migrated, then each lives in docs/ in English and contradictions are flagged"
      - "Given a pull request, when it is opened, then a template asks for area, contract impact, tests and data provenance"
    docs: [README.md, CONTRIBUTING.md, docs/README.md]
    evidence: [docs/README.md]
    subtasks:
      - {summary: "Translate and migrate design document, epics, elicitation matrix", assignee: adrien, hours: 6, status: Done}
      - {summary: "README, CONTRIBUTING, issue and PR templates", assignee: maria, hours: 3, status: Done}
      - {summary: "Docs index, glossary, risk register, way of working", assignee: diego, hours: 3, status: Done}
  - id: PM-02
    epic: E7
    type: Task
    summary: Architecture decision records 0001 to 0008
    story: "As a team, we need our expensive-to-reverse decisions written down with alternatives so that nobody reopens them by accident."
    priority: High
    points: 3
    sprint: SH Sprint 3
    assignee: james
    components: [docs]
    labels: [architecture]
    status: Done
    ac:
      - "Given each major decision (synthetic data, Pi 3B, MQTT, PostgreSQL/TimescaleDB, modular monolith, image storage, detector license), when reviewing docs/adr, then an ADR states context, decision, alternatives and consequences"
    docs: [docs/adr/README.md]
    evidence: [docs/adr/README.md]
    subtasks:
      - {summary: "Write ADR-0001 to ADR-0007", assignee: james, hours: 4, status: Done}
      - {summary: "Decide ADR-0008 (detector framework and repository license) with benchmark numbers", assignee: adrien, hours: 2, status: Done}
  - id: PM-03
    epic: E7
    type: Task
    summary: Client interview with the 30 elicitation questions
    story: "As the product owner, I need the client's answers to the elicitation matrix so that working assumptions become requirements."
    priority: Highest
    points: 3
    sprint: SH Sprint 4
    assignee: adrien
    components: [docs]
    labels: [requirements, client]
    status: To Do
    ac:
      - "Given the interview, when it ends, then every EL-xx row has an answer or an explicit 'client does not know'"
      - "Given an answer that contradicts a working assumption, when the log is filled, then the affected document or ADR is updated in the same sprint"
    docs: [docs/01-requirements/elicitation-matrix.md]
    subtasks:
      - {summary: "Schedule the meeting and send the question list in advance", assignee: adrien, hours: 1, status: To Do}
      - {summary: "Run the interview and fill the interview log", assignee: adrien, hours: 3, status: To Do}
      - {summary: "Propagate answers to docs (thresholds, retention, channels, demo scope)", assignee: diego, hours: 3, status: To Do}
  - id: PM-04
    epic: E7
    type: Task
    summary: Align presentation and spreadsheet backlog with the Pi 3B design
    story: "As a team, we need the presentation and backlog to describe the same node as the electrical design so that reviewers are not confused."
    priority: Medium
    points: 1
    sprint: SH Sprint 4
    assignee: ricardo
    components: [docs, hardware]
    labels: [consistency]
    status: To Do
    ac:
      - "Given the presentation and the spreadsheet backlog, when they are reviewed, then they mention the Raspberry Pi 3B + Ethernet node of Prototype 1 and list ESP32/LoRaWAN only as a future option (ADR-0003)"
    docs: [docs/02-hardware/hardware-review-notes.md, docs/adr/0003-raspberry-pi-3b-edge-node.md]
    subtasks:
      - {summary: "Update slides 8 and 9 (system design, technologies)", assignee: ricardo, hours: 1, status: To Do}
      - {summary: "Renumber spreadsheet stories to US01-US22 and add EN items", assignee: diego, hours: 1, status: To Do}

  # ---------------------------------------------------------------- E5 Synthetic data platform
  - id: EN-01
    epic: E5
    type: Story
    summary: Hive telemetry simulator v1 with stylized-fact tests
    story: "As the ML and backend teams, we need realistic simulated hive telemetry with labeled events so that we can build and test models and the dashboard without client data."
    priority: Highest
    points: 8
    sprint: SH Sprint 3
    assignee: diego
    components: [simulation]
    labels: [synthetic-data, telemetry]
    status: Done
    ac:
      - "Given a scenario YAML and a seed, when the simulator runs, then it writes telemetry, events, colony ground truth, weather and a manifest, identical on every run"
      - "Given the default scenario, when the stylized-fact tests run, then brood temperature, daily weight cycle, rain, swarm, absconding and humidity facts all pass"
      - "Given the observed columns, when compared with the DHT11 datasheet, then values are integers within its range and carry quality flags"
      - "Given six scenarios (baseline, swarm season, abscond/collapse, sensor faults, quiet hive, battery node), when generated with seed 42, then all finish in under a minute"
    docs: [docs/04-data/02-hive-telemetry-simulator.md, docs/04-data/03-scenarios-and-events.md, docs/04-data/04-sensor-and-node-realism.md]
    evidence: [simulation/telemetry/sim.py, simulation/telemetry/test_sim.py]
    subtasks:
      - {summary: "Weather, bloom and flight model", assignee: diego, hours: 4, status: Done}
      - {summary: "Colony, foraging, weight, temperature and humidity models", assignee: diego, hours: 8, status: Done}
      - {summary: "Colony and management events with labels", assignee: diego, hours: 4, status: Done}
      - {summary: "DHT11/HX711 and node outage/clock model", assignee: ricardo, hours: 3, status: Done}
      - {summary: "Stylized-fact tests and seed sweep", assignee: diego, hours: 3, status: Done}
      - {summary: "Scenario files and docs figure", assignee: diego, hours: 2, status: Done}
  - id: EN-01b
    epic: E5
    type: Story
    summary: Calibrate the telemetry simulator against real hive series
    story: "As the ML team, we need the simulator's parameter ranges checked against real measurements so that models trained on it transfer to a real hive."
    priority: Medium
    points: 5
    sprint: SH Sprint 8
    assignee: diego
    components: [simulation, ml]
    labels: [synthetic-data, calibration]
    status: To Do
    ac:
      - "Given MSPB (or our node's own data), when summary statistics are computed (daily amplitude, autocorrelation, event signatures), then simulated and real values overlap, or the ranges are tightened until they do"
      - "Given real weather history for the apiary's coordinates, when it replaces the stochastic weather, then the tests still pass"
    docs: [docs/04-data/02-hive-telemetry-simulator.md]
    subtasks:
      - {summary: "Download MSPB on a machine with Zenodo access; compute summary statistics", assignee: diego, hours: 4, status: To Do}
      - {summary: "Optional Open-Meteo history provider with Parquet cache", assignee: james, hours: 3, status: To Do}
      - {summary: "Tighten parameter ranges and record before/after in the doc", assignee: diego, hours: 3, status: To Do}
  - id: EN-02
    epic: E5
    type: Story
    summary: MQTT replay of simulated hives (fake nodes)
    story: "As the backend and frontend developers, we want simulated hives to publish over the real MQTT contract so that we can build and demo the system before the hardware is ready."
    priority: High
    points: 5
    sprint: SH Sprint 5
    assignee: james
    components: [simulation, backend]
    labels: [synthetic-data, integration]
    status: To Do
    blocked_by: [EN-07]
    ac:
      - "Given a generated telemetry dataset, when replay runs at speed N, then each sim- hive publishes valid telemetry, status and health messages on smarthive/v1/nodes/{node_id}/..."
      - "Given node outages in the dataset, when replayed, then the fake node goes offline (last will) and later sends its backlog, with some duplicates, like a real node"
      - "Given the demo_day scenario, when replayed at 1x, then a swarm at 11:00 and a node dropout at 16:00 happen on schedule"
    docs: [docs/05-backend/04-messaging-contract.md, docs/04-data/04-sensor-and-node-realism.md]
    subtasks:
      - {summary: "Replay CLI publishing from Parquet with paho-mqtt", assignee: james, hours: 5, status: To Do}
      - {summary: "Transport model: duplicates, late batches, reordering", assignee: karen, hours: 3, status: To Do}
      - {summary: "demo_day scenario with scripted events", assignee: diego, hours: 3, status: To Do}
      - {summary: "Contract test: replay output validates against JSON Schemas", assignee: karen, hours: 2, status: To Do}
  - id: EN-03
    epic: E5
    type: Story
    summary: Procedural insect renderer (license-free sprites)
    story: "As the vision team, we need labeled images of bees, Varroa, hornets, beetles and distractors without any licensed photo so that training data is unlimited and free to publish."
    priority: Highest
    points: 8
    sprint: SH Sprint 3
    assignee: adrien
    components: [simulation, vision]
    labels: [synthetic-data, vision]
    status: Done
    ac:
      - "Given a species and px/mm, when a sprite is rendered, then its size follows real body lengths (bee 12-15 mm, hornet 20-30 mm, SHB 5-7 mm, Varroa 1.6 x 1.1 mm)"
      - "Given a bee with mites, when rendered, then each mite sits on the dorsal thorax or abdomen and its pixel footprint matches 1.6 mm at that scale (test)"
      - "Given the renderer, when reviewed, then no external image or 3D model is used"
    docs: [docs/03-vision/03-synthetic-image-pipeline.md]
    evidence: [simulation/images/render.py, simulation/images/test_images.py]
    subtasks:
      - {summary: "Generic segmented-insect renderer (shading, bands, hair, wings, legs, antennae)", assignee: adrien, hours: 8, status: Done}
      - {summary: "Species samplers: bee (incl. Africanized), hornet (velutina, crabro), SHB, fly, ant, wasp, bumblebee", assignee: adrien, hours: 4, status: Done}
      - {summary: "Varroa sprite and anatomical placement; pollen loads as look-alikes", assignee: adrien, hours: 3, status: Done}
  - id: EN-04
    epic: E5
    type: Story
    summary: Entrance scene compositor with exact labels
    story: "As the vision team, we need full entrance scenes with occlusion-aware boxes and bee crops so that both model stages can be trained."
    priority: Highest
    points: 8
    sprint: SH Sprint 3
    assignee: adrien
    components: [simulation, vision]
    labels: [synthetic-data, vision]
    status: Done
    ac:
      - "Given a seed, when scenes are generated, then the same images and labels come out every time (test)"
      - "Given a scene, when labels are written, then every box lies inside the image and comes from the visible (not occluded) part of the insect"
      - "Given a bee crop, when it is labeled varroa, then at least one mite of that bee is visible in the scene"
      - "Given the dataset, when generated, then train and val use different sprite libraries and a dataset card is written"
    docs: [docs/03-vision/03-synthetic-image-pipeline.md, docs/04-data/05-dataset-versioning-and-governance.md]
    evidence: [simulation/images/compose.py]
    subtasks:
      - {summary: "Procedural boards: wood, paint, chips, stains, debris, entrance slot", assignee: adrien, hours: 4, status: Done}
      - {summary: "Behavioral placement, shadows, lighting, camera model", assignee: adrien, hours: 5, status: Done}
      - {summary: "Occlusion-aware labels, stage 1 YOLO export, stage 2 crops, dataset card", assignee: adrien, hours: 4, status: Done}
      - {summary: "Tier C: replace procedural boards with real board photos from the chosen camera", assignee: ricardo, hours: 3, status: To Do}
  - id: EN-05
    epic: E5
    type: Story
    summary: Real-image check set (tier P) from the iNaturalist Open Dataset
    story: "As the vision team, we need a frozen set of real, openly licensed insect photos so that we can measure how well synthetic training transfers to real images."
    priority: High
    points: 5
    sprint: SH Sprint 3
    assignee: adrien
    components: [vision]
    labels: [real-data, evaluation]
    status: Done
    ac:
      - "Given the iNaturalist open data, when filtered, then only research-grade, CC0/CC-BY first photos of our taxa are kept"
      - "Given the photos, when the split is frozen, then each file has class, split (calib/test), SHA-256, license, source URL and observer"
      - "Given the test split, when any training config is reviewed, then no test file is used for training or tuning"
    docs: [docs/04-data/01-data-problem-and-strategy.md]
    evidence: [vision/inat.py, vision/splits/P-inat-v1.tsv]
    subtasks:
      - {summary: "Streaming filter over the 4.8 GB metadata archive", assignee: adrien, hours: 3, status: Done}
      - {summary: "Download capped photos per class with manifest", assignee: adrien, hours: 1, status: Done}
      - {summary: "Freeze calib/test split with checksums", assignee: adrien, hours: 1, status: Done}
      - {summary: "Add the public Varroa datasets (Zenodo, Bilik et al.) from a machine with access", assignee: adrien, hours: 3, status: To Do}
  - id: EN-06
    epic: E5
    type: Task
    summary: Dataset versioning with DVC and dataset cards
    story: "As a team, we need datasets and weights versioned outside git so that any reported number can be reproduced."
    priority: Medium
    points: 3
    sprint: SH Sprint 4
    assignee: maria
    components: [infra, simulation]
    labels: [mlops]
    status: In Progress
    ac:
      - "Given a dataset under data/, when dvc push runs, then it is stored in the team's free remote and dvc pull restores it on another machine"
      - "Given a training run, when logged, then the dataset ID, generator commit and seed are recorded next to the metrics"
    docs: [docs/04-data/05-dataset-versioning-and-governance.md]
    evidence: [.dvc/config, vision/train.py]
    subtasks:
      - {summary: "dvc init, SSH or folder remote on the gateway PC", assignee: maria, hours: 2, status: In Progress}
      - {summary: "Track simulation outputs, tier P split files and released weights", assignee: adrien, hours: 2, status: To Do}

  # ---------------------------------------------------------------- E2 Pest & threat detection
  - id: US07
    epic: E2
    summary: Periodic hive entrance image capture
    story: "As a beekeeper, I want the system to capture periodic images of the hive entrance so that bee traffic and potential intruders can be analyzed automatically."
    priority: High
    points: 5
    sprint: SH Sprint 6
    assignee: ricardo
    components: [edge, hardware]
    labels: [camera]
    status: To Do
    blocked_by: [HW-01]
    ac:
      - "Given the node by day, when camd runs, then a low-res stream is analyzed for motion and a full-res still is taken on motion"
      - "Given night mode hours, when the clock enters them, then the camera stops and the sensors keep running"
      - "Given a configurable interval, when no motion happens for an hour, then one periodic image is still kept for the dashboard"
    docs: [docs/03-vision/06-edge-deployment.md, docs/03-vision/02-camera-and-optics.md]
    subtasks:
      - {summary: "picamera2 dual stream (or V4L2) capture service", assignee: ricardo, hours: 5, status: To Do}
