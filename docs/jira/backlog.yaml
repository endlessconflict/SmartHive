  - id: US12
    epic: E2
    summary: Multi-channel threat & pest notifications
    story: "As a beekeeper, I want to receive an in-app and email alert when a pest or intruder is detected so that I can act quickly without constantly checking the dashboard."
    priority: Highest
    points: 8
    sprint: SH Sprint 7
    assignee: james
    components: [backend, frontend]
    labels: [alerts]
    status: To Do
    blocked_by: [EN-07, EN-08]
    ac:
