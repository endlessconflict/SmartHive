  - id: US08
    epic: E2
    summary: Storage optimization based on relevance
    story: "As a beekeeper, I want the system to store only images where something relevant is detected so that storage is used efficiently."
    priority: Medium
    points: 3
    sprint: SH Sprint 6
    assignee: adrien
    components: [edge]
    labels: [storage]
    status: To Do
    blocked_by: [US11]
    ac:
      - "Given an analyzed frame with no threat and no Varroa-positive bee, when processing ends, then the full frame is not written to the SD card"
      - "Given a threat or a Varroa-positive bee, when processing ends, then the frame and its crops are saved and queued for upload"
    docs: [docs/05-backend/03-edge-node-software.md]
    subtasks:
      - {summary: "Keep/discard rule and tmpfs frame handling", assignee: adrien, hours: 3, status: To Do}
      - {summary: "Image table in the outbox with upload state", assignee: karen, hours: 2, status: To Do}
  - id: US09
    epic: E2
    summary: Automated Varroa mite detection
    story: "As a beekeeper, I want the system to automatically identify Varroa mites on returning bees so that I can start treatment before the infestation spreads."
    priority: Highest
    points: 13
    sprint: SH Sprint 7
    assignee: adrien
    components: [vision, edge]
    labels: [varroa, model]
    status: In Progress
    ac:
      - "Given a sharp bee crop at >= 8 px/mm, when stage 2 runs, then it outputs p(varroa) and the frame record carries it"
      - "Given synthetic validation crops (held-out sprites), when evaluated, then recall and precision for varroa are reported (tier S)"
      - "Given the public Varroa datasets, when available, then recall >= 0.75 and precision >= 0.70 on their test split (tier P target)"
      - "Given a rolling window, when bees are classified, then the Varroa index is reported with its count and 95 % Wilson interval"
    docs: [docs/03-vision/04-model-architecture.md, docs/03-vision/05-training-and-evaluation.md]
    evidence: [vision/pipeline.py, docs/03-vision/07-results.md]
    subtasks:
      - {summary: "Train stage 2 classifier on hybrid synthetic crops (v0.2)", assignee: adrien, hours: 3, status: Done}
      - {summary: "Varroa index with Wilson interval in the aggregator", assignee: adrien, hours: 2, status: Done}
      - {summary: "Evaluate on public Varroa crops (VarroaDataset) when downloaded", assignee: adrien, hours: 3, status: To Do}
      - {summary: "Bee tracking across frames to count individuals (v2)", assignee: adrien, hours: 8, status: To Do}
  - id: US10
    epic: E2
    summary: Small hive beetle and Asian hornet detection
    story: "As a beekeeper, I want the system to detect small hive beetles and Asian hornets at the entrance so that I can intervene before they damage the colony."
