$kind: http-request
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 204', () => pm.expect([204]).to.include(pm.response.code));
      pm.collectionVariables.set('token', '');
      pm.collectionVariables.set('token_expires_at', '0');
    language: text/javascript
order: 4000
