$kind: http-request
description: Stores the token in `token`. Postman keeps the refresh_token cookie by itself.
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "karen.jimenez1@udea.edu.co",
      "password": "Smarthivetest"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code === 200) {
          const d = pm.response.json();
          pm.collectionVariables.set('token', d.access_token);
          pm.collectionVariables.set('token_expires_at', String(Date.now() + d.expires_in * 1000));
      }
    language: text/javascript
order: 1000
