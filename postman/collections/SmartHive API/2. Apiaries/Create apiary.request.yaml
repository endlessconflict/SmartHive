$kind: http-request
url: "{{baseUrl}}/api/v1/apiaries"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Test apiary",
      "lat": 6.25,
      "lon": -75.56,
      "timezone": "America/Bogota"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) {
          const v = pm.response.json().id;
          if (v) { pm.collectionVariables.set('apiary_id', v); console.log('apiary_id =', v); }
      }
    language: text/javascript
order: 1000
