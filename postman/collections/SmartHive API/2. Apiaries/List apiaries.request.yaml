$kind: http-request
url: "{{baseUrl}}/api/v1/apiaries"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code === 200 && !pm.collectionVariables.get('apiary_id')) {
          const v = (pm.response.json().items[0] || {}).id;
          if (v) { pm.collectionVariables.set('apiary_id', v); console.log('apiary_id =', v); }
      }
    language: text/javascript
order: 2000
