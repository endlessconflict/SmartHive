$kind: http-request
url: "{{baseUrl}}/api/v1/hives/{{hive_id}}/images/latest"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) {
          const v = pm.response.json().id;
          if (v) { pm.collectionVariables.set('image_id', v); console.log('image_id =', v); }
      }
    language: text/javascript
order: 3000
