$kind: http-request
description: Shown once; 409 if the node already has a token.
url: "{{baseUrl}}/api/v1/nodes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{node_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.expect([201]).to.include(pm.response.code));
      if (pm.response.code < 300) {
          const v = pm.response.json().device_token;
          if (v) { pm.collectionVariables.set('device_token', v); console.log('device_token =', v); }
      }
    language: text/javascript
order: 5000
