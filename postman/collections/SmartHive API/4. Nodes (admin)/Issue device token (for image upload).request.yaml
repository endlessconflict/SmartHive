$kind: http-request
description: "For testing uploads by hand. Shown once, and replaces the node's own token (a running node then asks for a new one over MQTT). Register the node first."
url: "{{baseUrl}}/api/v1/nodes/{{node_id}}/device-token"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) {
          const v = pm.response.json().device_token;
          if (v) { pm.collectionVariables.set('device_token', v); console.log('device_token =', v); }
      }
    language: text/javascript
order: 5000
