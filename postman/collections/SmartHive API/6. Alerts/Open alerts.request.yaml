$kind: http-request
url: "{{baseUrl}}/api/v1/alerts?state=open"
method: GET
queryParams:
  state: open
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code < 300) {
          const v = (pm.response.json().items[0] || {}).id;
          if (v) { pm.collectionVariables.set('alert_id', v); console.log('alert_id =', v); }
      }
    language: text/javascript
order: 1000
