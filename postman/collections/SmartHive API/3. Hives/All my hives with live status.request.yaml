$kind: http-request
url: "{{baseUrl}}/api/v1/hives"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.expect([200]).to.include(pm.response.code));
      if (pm.response.code === 200 && !pm.collectionVariables.get('hive_id')) {
          const v = (pm.response.json().items[0] || {}).id;
          if (v) { pm.collectionVariables.set('hive_id', v); console.log('hive_id =', v); }
      }
    language: text/javascript
order: 3000
