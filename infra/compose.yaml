# SmartHive server stack. Design: docs/05-backend/08-deployment-and-operations.md
#
#   cp infra/.env.example infra/.env            # then set the passwords
#   bash infra/pki/make-ca.sh                   # once: local CA and broker certificate
#   bash infra/mosquitto/users.sh backend <pw>  # once per MQTT account (backend, simulator, healthcheck, node-*)
#   docker compose -f infra/compose.yaml --profile dev up -d
name: smarthive

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "8883:8883" # TLS only. 1883 is neither listened on nor published (US04)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./pki/out:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt -u healthcheck -P \"$$HEALTHCHECK_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      HEALTHCHECK_PASSWORD: ${MQTT_HEALTHCHECK_PASSWORD:?set it in infra/.env}
    restart: unless-stopped

  db:
    # Apache-2.0 build of TimescaleDB (the -oss variant), see ADR-0005
    image: timescale/timescaledb:2.17.2-pg16-oss
    environment:
      POSTGRES_USER: smarthive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in infra/.env}
      POSTGRES_DB: smarthive
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthive -d smarthive"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://smarthive:${POSTGRES_PASSWORD}@db:5432/smarthive
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000" # Caddy goes in front of this later; until then, localhost only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/readyz').status != 200)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mosquitto-data:
  db-data:
