# Broker configuration, tls port
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Activate mTLS
require_certificate true
use_identity_as_username true
allow_anonymous false

# A PUBACK ends the node's responsibility for a message, so the broker must not lose what it holds for the
# ingestor: its session and queued messages survive a restart, and an ingestor outage of many hours fits the queue.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100000

# Authentication and authorization
acl_file /mosquitto/config/acl
tls_version tlsv1.2

log_type all