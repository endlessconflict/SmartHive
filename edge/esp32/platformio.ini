; Optional: build with PlatformIO instead of idf.py. Same sources, configured with `pio run -t menuconfig`.
[platformio]
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; PlatformIO needs the embedded certificates listed here too (only used with SMARTHIVE_MQTT_TLS)
board_build.embed_txtfiles =
  main/certs/ca.crt
  main/certs/node.crt
  main/certs/node.key
