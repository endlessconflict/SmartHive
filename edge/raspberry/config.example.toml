# Copy to /etc/smarthive/node.toml (chmod 600, owner smarthive).
node_id = "node-0001"      # must be the CN of the client certificate
sample_interval_s = 60
max_pending = 1440         # samples kept in memory while the broker is unreachable (24 h at 60 s)

[mqtt]
host = "gateway.local"
port = 8883
tls = true                 # false only for a plain test broker on port 1883
ca = "/etc/smarthive/certs/ca.crt"
cert = "/etc/smarthive/certs/node-0001.crt"
key = "/etc/smarthive/certs/node-0001.key"

# Only with an HX711 and load cell wired; without this section the node sends no weight.
# offset and counts_per_kg come from the calibration in README.md.
# [scale]
# dout_gpio = 5            # BCM numbers
# sck_gpio = 6
# offset = 0               # raw counts with nothing on the scale
# counts_per_kg = 21000.0
# interval_s = 300
