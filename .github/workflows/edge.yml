name: edge

on:
  push:
    branches: [main]
    paths: ["edge/raspberry/**", ".github/workflows/edge.yml"]
  pull_request:
    paths: ["edge/raspberry/**", ".github/workflows/edge.yml"]

jobs:
  raspberry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge/raspberry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge/raspberry/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
