name: simulation

on:
  push:
    branches: [main]
    paths: ["simulation/**", ".github/workflows/simulation.yml"]
  pull_request:
    paths: ["simulation/**", ".github/workflows/simulation.yml"]

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: simulation/requirements.txt
      - run: pip install -r simulation/requirements.txt
      - run: python -m pytest -q simulation
