name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Relative links in Markdown resolve
        run: python scripts/check_links.py
      - name: Jira files are in sync with backlog.yaml
        run: python docs/jira/build.py && git diff --exit-code docs/jira
