name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "edge/raspberry/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "edge/raspberry/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest # ships with Docker, which the Testcontainers tests need
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The runner ships a newer pg_dump than the pg16 test database; its dumps set parameters pg16 rejects.
      # The backup test finds pg_dump and pg_restore on the PATH, so put the 16 client first.
      # Downloads retry: a dropped connection to postgresql.org must not fail the build. The key goes to a file
      # first, so gpg never reads a half-downloaded key.
      - shell: bash
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o "$RUNNER_TEMP/pgdg.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/pgdg.gpg "$RUNNER_TEMP/pgdg.asc"
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
