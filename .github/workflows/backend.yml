name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest # ships with Docker, which the Testcontainers tests need
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
