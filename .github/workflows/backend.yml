name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "infra/mosquitto/**", "infra/pki/**", ".github/workflows/backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest # ships with Docker, which the Testcontainers tests need
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The runner ships a newer pg_dump than the pg16 test database; its dumps set parameters pg16 rejects.
      # The backup test finds pg_dump and pg_restore on the PATH, so put the 16 client first.
      - run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
