name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The generators and the node pipeline need no torch; keep CI light.
      - run: pip install numpy pandas pyarrow scipy pyyaml opencv-python-headless ncnn pytest tabulate
      - run: python -m pytest -q simulation
      - run: python -m vision.pipeline
      - run: python docs/jira/build.py && git diff --exit-code docs/jira

  backend:
    runs-on: ubuntu-latest # ships with Docker, which the Testcontainers tests need
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
