[project]
name = "smarthive"
version = "0.1.0"
description = "SmartHive backend: MQTT ingestor, API and worker"
requires-python = ">=3.11"
dependencies = [
    "aiomqtt>=2.5",
    "alembic>=1.16",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pyjwt>=2.9",
    "python-multipart>=0.0.20",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.34",
    "websockets>=14",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
    "testcontainers[postgres]>=4.10",
]

[project.scripts]
smarthive = "smarthive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The migrations are not a Python package; the wheel has to carry them for `smarthive migrate`
[tool.setuptools.package-data]
smarthive = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a Docker daemon (Testcontainers)"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# long SQL strings read better unbroken
"src/smarthive/alerts/*" = ["E501"]
"src/smarthive/api/routes/alerts.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*", "alembic.*", "argon2.*"]
ignore_missing_imports = true
